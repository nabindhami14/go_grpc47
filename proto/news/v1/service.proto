syntax = "proto3";

option go_package = "github.com/nabindhami14/go_grpc47/api/news/v1;newsv1";

package news.v1;

import "news/v1/news.proto";
import "google/protobuf/empty.proto";
 
service NewsService {
    rpc CreateNews (CreateNewsRequest) returns (CreateNewsResponse);
    rpc GetNews (GetNewsRequest) returns (GetNewsResponse);

    // SERVER SIDE STREAMING
    rpc GetAllNews (google.protobuf.Empty) returns (stream GetNewsResponse);

    // CLIENT SIDE STREAMING
    rpc UpdateNews(stream CreateNewsRequest) returns (google.protobuf.Empty);
} 